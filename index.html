<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=public/index.html" />
  <title>Zovira | 3D Interactive E-Commerce Store</title>
  <style>
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    .launcher-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .brand-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.8rem;
      margin: 0.25rem 0 1rem;
      background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn-launch {
      display: inline-block;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.85rem 1.8rem;
      border-radius: 9999px;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }
    .btn-launch:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
    }
  </style>
  <script>
    // Immediate redirect to public/index.html
    window.location.replace("public/index.html");
  </script>
</head>
<body>
  <div class="launcher-card">
    <div class="brand-icon">💎</div>
    <h1>Zovira 3D Store</h1>
    <p>Opening Next-Gen 3D Interactive E-Commerce Storefront...</p>
    <a href="public/index.html" class="btn-launch">Click here to Open Zovira Store</a>
  </div>
</body>
</html>
